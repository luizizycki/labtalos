fullnameOverride: argocd

configs:
  params:
    server.insecure: true
  rbac:
    policy.default: role:read-only

# --- Server ---
server:
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443

# --- Repo Server ---
repoServer:
  extraArgs:
    - --sops-enabled
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /home/argocd/sops/age.key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  timeout: 120
  volumes:
    - name: age-key
      secret:
        secretName: sops-age-key
  volumeMounts:
    - name: age-key
      mountPath: /home/argocd/sops
      readOnly: true

# --- Application Controller ---
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# --- Redis (single para homelab) ---
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- Notifications ---
notifications:
  enabled: false

# --- ApplicationSet ---
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
