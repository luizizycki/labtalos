image:
  repository: library/nextcloud
  tag: "33"
  pullPolicy: IfNotPresent

nextcloud:
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  trustedDomains:
    - localhost
    - nextcloud.izycki.com.br
  objectStore:
    s3:
      enabled: true
      existingSecret: nextcloud-b2
      secretKeys:
        accessKey: access-key
        secretKey: secret-key
      bucket: labtalos
      host: s3.us-east-005.backblazeb2.com
      region: us-east-005
      usePathStyle: true
      ssl: true
      port: "443"
  configs:
    overwrite.config.php: |-
      <?php
      $CONFIG = array (
        'overwriteprotocol' => 'https',
        'overwritehost' => 'nextcloud.izycki.com.br',
        'overwritecondaddr' => '^.*$',
      );
internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: mysql
  host: nextcloud-mariadb
  database: nextcloud
  user: nextcloud
  password: changeme
  existingSecret:
    enabled: false
    usernameKey: db-username
    passwordKey: db-password

mariadb:
  enabled: true
  architecture: standalone
  auth:
    database: nextcloud
    username: nextcloud
    password: changeme
  primary:
    persistence:
      storageClass: nfs-storage
      size: 10Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 500m

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      storageClass: nfs-storage
      size: 1Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 100m

httpRoute:
  enabled: true
  hostnames:
    - nextcloud.izycki.com.br
  parentRefs:
    - name: labtalos-gateway
      namespace: default

persistence:
  enabled: false

extraManifests:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: nextcloud-admin
      namespace: nextcloud
    spec:
      encryptedData:
        password: 
        username: 
      template:
        metadata:
          name: nextcloud-admin
          namespace: nextcloud
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: nextcloud-b2
      namespace: nextcloud
    spec:
      encryptedData:
        access-key: 
        secret-key: 
      template:
        metadata:
          name: nextcloud-b2
          namespace: nextcloud

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 1


